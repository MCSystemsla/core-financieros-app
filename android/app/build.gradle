plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}
def keystoreProperties = new Properties()
   def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
   }

android {
    namespace = "com.mcsystem.core_financiero_app"
    compileSdk = 34
    ndkVersion = '25.1.8937393'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
     signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile']) 
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mcsystem.core_financiero_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 28
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // ndk { 
        //     // abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64" 
        //     abiFilters "arm64-v8a","x86","x86_64"
        // }
    }
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include "arm64-v8a", "armeabi-v7a"
    //         universalApk false
    //     }
    // }
    buildTypes {
        debug {
            // Generar un APK universal en modo debug (para emulador)
            splits {
                abi {
                    enable false
                }
            }
        }

        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            // signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
    //     splits {
    //     abi {
    //         enable true
    //         reset()
    //         include "arm64-v8a", "armeabi-v7a"
    //         universalApk false
    //     }
    // }
        }
    }
    flavorDimensions "country"
    productFlavors {
        micreditoQA {
            dimension "country"
            resValue "string", "app_name", "MiCrédito QA"
            // versionNameSuffix ".ni"
            applicationId "com.mcsystem.core_financiero_app.qa"
            versionName "1.8.19"
            versionCode 27
        }
        micreditoNicaragua {
            dimension "country"
            resValue "string", "app_name", "MiCrédito"
            // versionNameSuffix ".ni"
            applicationId "com.mcsystem.core_financiero_app.ni"
            signingConfig signingConfigs.release
            versionName "1.4.5"
            // versionCode flutterVersionCode.toInteger() + 1
            versionCode 5
        }
        micreditoHonduras {
            dimension "country"
            resValue "string", "app_name", "MiCrédito Honduras"
            // versionNameSuffix ".hn"
            // applicationId "com.mcsystem.core_financiero_app.hn"
            applicationId "com.mcsystem.core_financiero_app.hnd"
            signingConfig signingConfigs.debug
            versionName "1.11.39"
            versionCode 49
            // versionCode flutterVersionCode.toInteger() + 1
        }
        micreditoCostaRica { 
            resValue "string", "app_name", "MiCrédito Costa Rica"
            // versionNameSuffix ".cr"
            applicationId "com.mcsystem.core_financiero_app.cr"
            signingConfig signingConfigs.debug
            versionName "1.3.3"
            versionCode flutterVersionCode.toInteger() + 1
        }
    }
}
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

flutter {
    source = "../.."
}
